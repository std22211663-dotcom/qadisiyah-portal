# مثال إعداد nginx أمام البوابة مع HTTPS
# غيّر portal.example.iq إلى نطاق المديرية، واستخدم certbot لإصدار الشهادة.
server {
    listen 80;
    server_name portal.example.iq;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.example.iq;

    ssl_certificate     /etc/letsencrypt/live/portal.example.iq/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.iq/privkey.pem;

    # المرفقات: 5 ملفات × 5 م.ب
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
