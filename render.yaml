services:
  - type: web
    name: qadisiyah-portal-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # القرص الدائم لا يتوفر في الخطة المجانية
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: SERVE_STATIC
        value: "0"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD   # اكتب كلمة المرور في لوحة Render عند أول نشر ثم احذفها
        sync: false
    disk:
      name: portal-data
      mountPath: /var/data
      sizeGB: 5
